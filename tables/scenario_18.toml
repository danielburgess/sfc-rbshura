[table]
name = "scenario_18"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (45 entries).
offset = "$85B8EF"
count = 45
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$85B949"
end = "$85BD95"

[section]
kind = "script"
[section.placement]
mode = "relocate"
