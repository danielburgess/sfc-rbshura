[table]
name = "scenario_04"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (63 entries).
offset = "$8595B5"
count = 63
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$859633"
end = "$859E96"

[section]
kind = "script"
[section.placement]
mode = "relocate"
