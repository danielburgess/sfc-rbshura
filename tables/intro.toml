# Intro narrative — two FF-terminated text blocks the story renderer at
# $05:F010 reads directly from ROM (no pointer table). Retrotool treats
# the whole region as one 1838-byte fixed record with two named fields,
# matched to the `<<$1FC8F1:0.partN>>` headers in data/{lang}/intro.txt.
#
# Encoding uses tables/rbshura_br_pt.tbl (or whichever language table is
# active for the editable folder). The intro renderer reads bytes
# directly and dispatches FE XX as a 2-byte kanji escape — if the user
# leaves residual JP / kanji characters in their translation, those need
# either an English replacement or a raw-byte form like `[20]` for layout
# spacing.
#
# Auto-pack mode (no per-field `start`/`len`, no `block_len`):
# - part1 packs at offset 0 (so the pointer at $1F:C57F = $C8F1 still works)
# - part2 packs immediately after part1 with whatever size it encodes to
# - retrotool auto-fills the 25 pointer-table entries at $1F:C5A7-$C5D7
#   with part2's actual within-bank address every build
# - total bounded only by `[data].end` (currently set to give ~5 KB of
#   headroom over the current encoded size of ~3 KB)
#
# Net: editing data/{en,jp}/intro.txt requires zero ROM-bookkeeping. As
# long as part1+part2 fit in the data region, the build just works.

entries = 1
[[fields]]
label = "part1"
fill = 0x00

[[fields]]
label = "part2"
fill = 0x00
ptr_writes = [
    # 25 × 16-bit within-bank pointers driving part2 playback. The pointer
    # value (part2's auto-computed offset) is recomputed each build.
    { addr = "$1FC5A7", count = 25, size = 2, format = "within-bank" },
]

[table]
name = "intro"
type = "fixed"

[encoding]
table_file = "tables/rbshura_br_pt.tbl"
terminator = 0xFF

[data]
# RELOCATED 2026-05-20 to bank $E0 (expansion-bank freespace) so the
# intro text doesn't share space with bank $1F's event-script data.
# patches/relocate_intro.asm flips the renderer's hardcoded DBR from
# $DF (HiROM mirror of $1F) to $E0, so reads land here instead of the
# original $1F:C8F1 / $1F:CD35. Same low-16 offsets within the bank.
#
# File offsets ($1F:C8F1 → $E0:C8F1 = file $20:C8F1).
# `end` bounds total auto-packed size; current encoded content is ~3 KB
# (part1 ≈ 1957 B + part2 ≈ 1052 B). End deliberately stops at $20DB00 —
# NOT $20DC91 — to leave a ~400 B gap before the narration renderer at
# $E0:DC91 (patches/narration_render.asm). retrotool raises on overflow, so
# this makes an over-budget intro fail the build WITH margin instead of
# packing right up against the renderer's first byte. ~1.6 KB headroom
# remains over current content. If you bump this, also update the matching
# freespace split in project.toml.
offset = "$20C8F1"
end = "$20DB00"

[section]
kind = "fixed-records"
