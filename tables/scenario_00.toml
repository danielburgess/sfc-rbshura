[table]
name = "scenario_00"
type = "pointer"

[encoding]
table_file = "tables/rbshura_br_pt.tbl"
terminator = 0xFF

[pointers]
# Scenario 0 string-pointer table. 24-bit LE HiROM pointers, 59 entries.
# Pointer table address is SNES $85:86E4 (HiROM) = PC $0586E4.
# Widened from 16-bit (size=2) to 24-bit (size=3) on 2026-05-17 — requires
# the 24-bit pointer engine patch (patches/24bit_ptrs.asm) to be present
# in the source ROM. With 24-bit ptrs the relocate handler routes every
# entry into the [rom.build].freespace pool (24-bit fast path), so the
# [data] region below is informational only — it is NOT used for packing.
offset = "$0586E4"
count = 59
size = 3

[data]
# IGNORED under pointer-size=3. Kept for documentation: the original
# 16-bit-ptr layout sized strings into $85875A..$858E6B. With the 24-bit
# fast path every entry is allocated from freespace; the original slot
# bytes are left untouched (overwritten by the new 3-byte ptr table
# extending from $8586E4 + 59*3 = $858795).
offset = "$058795"
end = "$058795"

[section]
kind = "script"
[section.placement]
mode = "relocate"
