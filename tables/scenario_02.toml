[table]
name = "scenario_02"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (42 entries).
offset = "$858FD0"
count = 42
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$859024"
end = "$8592E5"

[section]
kind = "script"
[section.placement]
mode = "relocate"
