# Post-intro-scroll character-narration screens — pointer-handled text blocks.
# These are the ELFIN / DICK / KYTHRING / JIMMY name+epilogue screens shown
# after the main intro scroll. They live in the $1F:C57F screen pointer table
# at idx 1-19 (variable-length entries; idx 1,2,3 etc. share a pointer where a
# screen persists across cutscene steps).
#
# Rendered by patches/narration_render.asm (ported from Peacekeepers): each
# entry is [dest_word:2] + 1-byte half-width char indices + [FF]; the renderer
# DMAs one 8x16 PK-font glyph per index, render-at-once. It reads the stream
# with DBR=$DF (bank $1F), so the text stays in bank $1F.
#
# This is a pointer DataDef (NOT fixed-records — entry lengths are irrelevant,
# the pointer table addresses each block). retrotool reads the 19 pointers at
# $1F:C581 (idx 1), relocates the encoded EN blocks into the data region, and
# rewrites the 16-bit within-bank pointers. The intro owns idx 0 (part1) and
# idx 20-44 (part2 via tables/intro.toml); this owns idx 1-19 only — the ranges
# partition the table and do not overlap.

[table]
name = "narration_screens"
type = "pointer"

[encoding]
table_file = "tables/rbshura_br_pt.tbl"
terminator = 0xFF

[pointers]
# $1F:C57F idx 1 = file $1FC581. 19 entries (idx 1-19). 16-bit within-bank
# pointers (bank $1F) — the renderer and the intro both read this table as
# 16-bit, so it must stay size=2.
offset = "$1FC581"
count = 19
size = 2

[data]
# The screens' own region in bank $1F. retrotool packs 16-bit-pointer text into
# the POINTER TABLE's bank ($1F) and pins each entry to its source PC — it can
# NOT relocate this data to another bank by changing the offset (that pins to
# ptr_tbl_bank in handlers.py). So the screens stay in bank $1F.
#
# EXTENDED 2026-05-31 from $1F:C8F1 to $1F:CD35 (+1092 B). The original 792 B
# region ($1F:C5D9..$1F:C8F1) overflowed — entry 15 (the final JIMMY epilogue,
# ~122 B) could not fit and shipped UNTRANSLATED. The intro relocation to bank
# $E0 (tables/intro.toml + patches/intro_double_render.asm/intro_dest_bank.asm)
# made the original intro part1 bytes at $1F:C8F1..$1F:CD35 DEAD — the engine
# now reads part1 from $E0:C8F1 (idx-0 pointer read with DBR=$E0), so $1F:C8F1
# is no longer referenced at runtime. Reclaiming it gives the narration ~1 KB of
# headroom with NO renderer change (DBR stays $DF) and NO new bank. $1F:CD35
# (old intro part2, still possibly live for non-text screen blocks) is the hard
# stop — do not extend past it.
offset = "$1FC5D9"
end = "$1FCD35"

[section]
kind = "script"
[section.placement]
mode = "relocate"
