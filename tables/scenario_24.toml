[table]
name = "scenario_24"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (101 entries).
offset = "$85D073"
count = 101
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$85D13D"
end = "$85DDFB"

[section]
kind = "script"
[section.placement]
mode = "relocate"
