[table]
name = "scenario_16"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (73 entries).
offset = "$85AE5C"
count = 73
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$85AEEE"
end = "$85B6D4"

[section]
kind = "script"
[section.placement]
mode = "relocate"
