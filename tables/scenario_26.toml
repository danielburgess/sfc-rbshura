[table]
name = "scenario_26"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (71 entries).
offset = "$85E170"
count = 71
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$85E1FE"
end = "$85EDDF"

[section]
kind = "script"
[section.placement]
mode = "relocate"
