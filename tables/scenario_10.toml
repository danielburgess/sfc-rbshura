[table]
name = "scenario_10"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $87 (32 entries).
offset = "$87879C"
count = 32
size = 2

[data]
# Bank $87 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$8787DC"
end = "$878A13"

[section]
kind = "script"
[section.placement]
mode = "relocate"
