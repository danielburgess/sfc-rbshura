[table]
name = "scenario_20"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (43 entries).
offset = "$85BFA1"
count = 43
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$85BFF7"
end = "$85C5F7"

[section]
kind = "script"
[section.placement]
mode = "relocate"
