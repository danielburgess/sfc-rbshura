[table]
name = "scenario_08"
type = "pointer"

[encoding]
table_file = "tables/rbshura_en.tbl"
terminator = 0xFF

[pointers]
# 16-bit LE pointers in HiROM bank $85 (33 entries).
offset = "$85A70C"
count = 33
size = 2

[data]
# Bank $85 upper-half ROM region. Permissive bounds — scenarios
# share strings within a bank; tighten when build-side ownership matters.
offset = "$85A74E"
end = "$85A99B"

[section]
kind = "script"
[section.placement]
mode = "relocate"
