# Rushing Beat Shura - English Translation
# MAIN PROJECT FILE

# Top-level scalars MUST come before any [section] header in TOML.
data_dirs = ["tables"]
jp_data_dir = "data/jp"
en_data_dir = "data/en"

[rom]
name = "rbshura_en"
# Pristine JP source. Every transformation that turns it into the EN ROM
# (PK font, tight renderer, 24-bit pointer engine, char_names, 14 scenarios)
# is expressed below as a [[rom.build.sections]] entry. The build is one
# retrotool `build_project()` call — no Python pre-steps.
file = "roms/rbshura.sfc"
mapping = "hirom"
# Expanded from 2 MB → 4 MB. HiROM addresses banks $C0-$FF (file 0..$3FFFFF).
# Banks $E0-$FF (file $200000..$3FFFFF) are pristine expansion space and
# form the bulk of the freespace pool.
size = "4M"

[rom.build]
# Default output directory (retrotool ≥ 2026-05-26): the built ROM lands at
# <output_dir>/<rom.name>.sfc = out/rbshura_en.sfc when build_24bit.py /
# `retrotool build` is run without an explicit output path. retrotool creates
# the folder if missing.
output_dir = "out"
# Freespace for relocate-mode 24-bit-ptr allocation. The bump allocator
# walks ranges in declaration order; the in-ROM-gap entries come first so
# small holes get filled before we eat into the expansion bank. The
# bank $08 range must skip TWO reservations that live in this bank's
# freespace: the 24-bit engine stub at $087000..$087030, AND
# NewIntroRenderer (patches/intro_double_render.asm, org $C87080) which
# occupies $087080..$087117 (152 B). The range therefore starts at $087180
# (~100B safety margin past the renderer, in case its size shifts when the
# !INTRO_BG3_HOFS / DMA-descriptor constants are tuned). Starting at $087080
# previously let the allocator place scen 3 entry 26 at $C8:7080 — asar then
# overwrote it with the renderer, so that one string rendered as machine code.
freespace = [
    ["$1A9CF3", "$1AC003"],   # bank $1A: 8977 B (largest in-ROM run)
    ["$087180", "$088000"],   # bank $08: 3712 B (after 24-bit stub + NewIntroRenderer)
    ["$1AF2F3", "$1B0001"],   # bank $1A: 3343 B
    ["$0C97FE", "$0CA000"],   # bank $0C: 2050 B
    ["$023800", "$024000"],   # bank $02: 2048 B
    ["$1BF878", "$1C0006"],   # bank $1B: 1935 B
    ["$0CB9FD", "$0CC000"],   # bank $0C: 1539 B
    ["$0975DA", "$097A1B"],   # bank $09: 1089 B
    # Expansion banks $E0-$FF: 2 MB pristine pool. Used after in-ROM space
    # is exhausted. Plenty of headroom for future EN content / patches.
    # SPLIT around three reservations:
    #   * intro region (file $20:C8F1..$20:DC90, ~5 KB) — see
    #     tables/intro.toml's `[data].end` and `[[fields]]`
    #   * narration renderer (file $20:DC91..$20:DD90, 256 B) — the relocated
    #     half-width text renderer; see patches/narration_render.asm (org $E0DC91)
    #   * scen 14 region (file $20:F000..$20:FF00, ~4 KB) — see
    #     tables/scenario_28.toml; the engine redirect in
    #     patches/24bit_ptrs.asm makes scen 14 read its 24-bit L4 table
    #     + strings from $E0:F000 instead of WRAM $7E:C700
    # Allocator skips both reserved holes.
    ["$200000", "$20C8F1"],   # $E0:0000..$E0:C8F0
    # $E0:DD91..$E0:DDD0 reserved for NarrationGate (patches/narration_render.asm) —
    # the screen-state gate scoping the half-width renderer to narration screens only.
    ["$20DDD0", "$20E000"],   # $E0:DDD0..$E0:DFFF   (post-NarrationGate, pre-ScriptGate)
    ["$20E080", "$20F000"],   # $E0:E080..$E0:EFFF   (post-ScriptGate, pre-scen14). ScriptGate
                              # stub (scen28_script_gate.asm, org $E0E000) now gates $00D5
                              # too and runs to ~$E04x; reserve $E000..$E080 for it. Was
                              # $20E020 — that OVERLAPPED the 55-byte stub (latent collision).
    ["$20FF00", "$210000"],   # $E0:FF00..$E0:FFFF   (post-scen14, pre-attack-names)
    # $E1:0000..$E1:0FFF (file $210000..$211000) reserved for the relocated
    # attack-name graphics pool (assets/attack_names_e1.bin, ~3.3 KB). See
    # patches/attack_names_reloc.asm + tools/encode_attack_names.py.
    # $E1:1000..$E1:A0FF reserved for relocated EN title art (gated $00C8==2):
    #   $E1:1000 title_logo.bin    (16 KiB BG1 logo char, 512 tiles)
    #   $E1:5000 title_kanji.bin   (8 KiB OBJ kanji tiles)
    #   $E1:7000 title_tilemap.bin (12 KiB BG1+BG2+BG3 map blob)
    #   $E1:A000 gated source stubs (patches/title_logo_reloc.asm)
    #   $E1:A200 title_kanji_meta.bin (EN SHURA metasprite table)
    #   $E1:A300 Phase0Skip stub (patches/intro_skip.asm — START skips splashes; SHELVED/disabled)
    #   $E1:A340 DrawCredit + EN credit string (patches/intro_credit.asm — G2 splash credit)
    # See TITLE_INTRO_PLAN.md Phase 1/2/3.
    ["$21A3C0", "$400000"],   # $E1:A3C0..$FF:FFFF   (post-title-art + intro-skip + credit)
]

# ---- Inline sections: font + engine patches ----
# Run before any DataDef section (declaration order = build order). The
# scenario / char_names DataDefs from tables/*.toml are appended after.

# 1. PK Latin font (8×16, 80 glyphs × 64B slots = 5120B at $100000).
# bytes 0..31 of each slot = PK top tile + bottom tile.
# bytes 32..63 of each slot = zero pad (never DMA'd at the tight $20 size).
# Custom glyphs ('*' at 0x4B etc.) are baked into the binary; regenerate
# via tools/build_en_font.py if charmap / CUSTOM_GLYPHS change.
[[rom.build.sections]]
kind = "bin"
file = "fonts/rbshura_en.bin"
offset = "$100000"

# 2. Tight-8 renderer patch — single-tile-column per char, 32 chars/line.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/tight_renderer.asm"

# 3. 24-bit pointer engine — widens L4 deref to 24-bit + flips B1→B7 char
# reads + JSL stub at $C87000 + ROM-size byte $00:FFD7 = $0F.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/24bit_ptrs.asm"

# 3b. Scen 14 (ending cutscene) L1-advance handshake gate. Hooks the bank-$85
# cutscene script player at $85:EE85 so the $1C48 (entry) advance waits for the
# renderer's done-sentinel ($1C56=$FFFF) and re-engages it (STZ $1C56), letting
# longer EN text finish each entry. Stub at $E0:E000. See
# memory/project_wram_resident_scenarios.md 2026-05-23 for evidence.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/scen28_script_gate.asm"

# 3c. Scen 14 animation/fade timing tweaks — per-step wait-byte edits in the
# bank-$DF cutscene script. Edit patches/scen28_timing.asm directly; map steps
# with tools/dump_scen28_script.py. No-op until tweaks are added.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/scen28_timing.asm"

# 4. Convert intro typewriter → static (PK-style). rbshura's bank $1F has
# 17 `JSL $80:D8E8` sites (the VBlank-wait routine Jaleco inserted on top
# of PK's renderer) that produce the typewriter cadence. PK's same bank
# region has zero of these calls. NOPping them removes the per-char wait
# so all chars render in one frame. Risk: other side-effects of $80:D8E8
# (audio/NMI yield) — narrow the set if anything else regresses.
#[[rom.build.sections]]
#kind = "asar"
#file = "patches/intro_remove_delays.asm"

# 5. Intro renderer — double-render per outer invocation (match PK cadence)
# + DMA-descriptor tuning for the PK font + bank-flip $DF→$E0 baked in.
# Renderer body is JSL'd twice from $05:EFFD-$F005 (overwrites the original
# inline prologue; orphans $05:F006-$F08B). Net effect: typewriter throughput
# doubles to match PK's measured ~12 chars/sec; intro text reads from the
# relocated bank-$E0 region (via `LDA #$E0` at $0870A8 in the new renderer);
# the existing BG3VOFS HDMA scroll (chan 7, $7E:0530) keeps incrementing
# once per outer call via the unchanged `INC $0530` at $05:EFFA.
# Note: the part2 pointer-table repoint (25 entries at $1F:C5A7-$C5D7) is
# handled automatically by tables/intro.toml via field-level `ptr_writes`,
# not a separate asar patch — so part1/part2 budget changes flow through
# without manual address bookkeeping.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/intro_double_render.asm"

# 5a2. Finish the intro/ending relocation: flip the engine text-setup's
# dest-word read DBR ($05:F325) from $DF to $E0 so each block's leading VRAM
# dest word is read from the SAME relocated bank ($E0) as the text. Without
# this the Maria ending (intro part2) read a garbage dest from $1F:D110 and
# filled the screen with garbage. See the patch header for full detail.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/intro_dest_bank.asm"

# 5b. Post-intro-scroll character-narration screens -> HALF-WIDTH render-at-once.
# Ported from Peacekeepers (official EN release): the $1F:C57F idx-1-19 glyph-DMA
# renderer (fadeScreenIn, $05:F18C) is converted to read 1-byte char indices and
# DMA half-width (8x16) PK-font glyphs, $FF-terminated. The $00C9 dispatch is
# UNTOUCHED (no Site A/B), so the intro main scroll is unaffected. Routine is
# relocated to bank $E0 ($E0DC91) and JSL'd (preserves caller PBR). Text data is
# tables/narration.toml (bank $1F, idx 1-19 region). Supersedes the reverted
# narration_halfwidth.asm. See docs/ending_narration_plan.md + memory.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/narration_render.asm"

# 6. Special-move "attack name" word-art (e.g. Dragon Wave) — relocated to bank
# $E1 so English plates can exceed the stock 32-tile budget. Each name is a
# `kind="graphics"` PNG section: retrotool runs SuperFamiconv at build time to
# 2bpp tiles + a projected 128-entry BG3 tilemap (palette-anchors map furigana
# colours -> CGRAM pal4, kanji -> pal5; tile-base $E0 = the VRAM slot the loader
# DMAs into; map-base-entry places the plate in the same screen window as stock).
# Use the English plate (<idx>_<slug>_en.png) where it exists, the dumped
# Japanese plate otherwise. The companion asar patch repoints the loader source
# bank ($CF->$E1), bumps the tile DMA count ($200->$240 = 36 tiles), and rewrites
# the source-address table $82:DC8C with the $E1 offsets (idx 4 dups dragon_wave).
# Dump/edit workflow: tools/dump_attack_names.py. See memory/project_attack_names.md.
#
# $E1 layout: tiles[i] at $E1:(i*$240); maps[i] at $E1:($900 + i*$100).
[[rom.build.sections]]
kind = "graphics"
file = "export/attack_names/0_thunder_edge_en.png"   # English
bpp = 2
offset = "$210000"          # tiles -> $E1:0000
tile-count = 36       # MUST be <= 36: each $E1 tile slot is $240 (36 tiles) and matches the DMA count; >36 overruns into the next slot / the tilemaps
color-zero = "FF00FF"
colors = 4
palettes = 2
palette-from-png = true       # pack against the PNG's own palette order (match CGRAM)
map-offset = "$210900"      # tilemap -> $E1:0900
tile-base = "$80"
map-cols = 32
map-entries = 128
map-base-entry = 2
priority = true
palette-anchors = "4:E7E700,5:FF5A08"

[[rom.build.sections]]
kind = "graphics"
file = "export/attack_names/1_assault_tiger_en.png"
bpp = 2
offset = "$210240"          # tiles -> $E1:0240
tile-count = 36       # MUST be <= 36: each $E1 tile slot is $240 (36 tiles) and matches the DMA count; >36 overruns into the next slot / the tilemaps
color-zero = "FF00FF"
colors = 4
palettes = 2
palette-from-png = true       # pack against the PNG's own palette order (match CGRAM)
map-offset = "$210A00"      # tilemap -> $E1:0A00
tile-base = "$80"
map-cols = 32
map-entries = 128
map-base-entry = 0
priority = true
palette-anchors = "4:E7E700,5:FF5A08"

[[rom.build.sections]]
kind = "graphics"
file = "export/attack_names/2_dragon_wave_en.png"
bpp = 2
offset = "$210480"          # tiles -> $E1:0480
tile-count = 36       # MUST be <= 36: each $E1 tile slot is $240 (36 tiles) and matches the DMA count; >36 overruns into the next slot / the tilemaps
color-zero = "FF00FF"
colors = 4
palettes = 2
palette-from-png = true       # pack against the PNG's own palette order (match CGRAM)
map-offset = "$210B00"      # tilemap -> $E1:0B00
tile-base = "$80"
map-cols = 32
map-entries = 128
map-base-entry = 2
priority = true
palette-anchors = "4:E7E700,5:FF5A08"

[[rom.build.sections]]
kind = "graphics"
file = "export/attack_names/3_bird_storm_en.png"
bpp = 2
offset = "$2106C0"          # tiles -> $E1:06C0
tile-count = 36       # MUST be <= 36: each $E1 tile slot is $240 (36 tiles) and matches the DMA count; >36 overruns into the next slot / the tilemaps
color-zero = "FF00FF"
colors = 4
palettes = 2
palette-from-png = true       # pack against the PNG's own palette order (match CGRAM)
map-offset = "$210C00"      # tilemap -> $E1:0C00
tile-base = "$80"
map-cols = 32
map-entries = 128
map-base-entry = 0
priority = true
palette-anchors = "4:E7E700,5:FF5A08"

[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/attack_names_reloc.asm"

# Title BG1 logo (RUSHING BEAT + 修羅) relocated to $E1:1000, gated to the main
# title only ($00C8==2). The shared screen-push routine's char DMA ($DF:DE73,
# $7F:4000 -> VRAM $2000) is repointed to $E1:1000 via a $00C8-gated stub so the
# splash ($00C8=0) and narration ($00C8=6) screens are unaffected. 8 KiB of
# final 4bpp tiles (256 tiles). To redraw: export/title_bg1_logo.png ->
# superfamiconv 4bpp -> assets/title_logo.bin (keep tile grid / tilemap).
# EN title BG1 logo — custom graphics encoder, runs DURING the build.
# tools/encode_title_logo.py quantizes export/title_bg1_logo_en.png to the
# original CGRAM pal 4/5/6 and emits: a 16 KiB char (512 tiles; expanded 8K->16K
# for the EN art's ~346 tiles) at $E1:1000, and the BG1 tilemap spliced into the
# 12 KiB BG1+BG2+BG3 combined blob at $E1:7000. Relocated + gated to the title
# ($00C8==2) by patches/title_logo_reloc.asm. Edit the PNG → rebuild (no extra
# steps). assets/title_cgram.bin + assets/title_tilemap_orig.bin are the encoder
# inputs (committed).
[[rom.build.sections]]
kind = "graphics"
encoder = "tools/encode_title_logo.py:build"
file = "export/title_bg1_logo_en.png"
offset = "$211000"          # char  -> $E1:1000 (16 KiB)
map-offset = "$217000"      # tilemap blob -> $E1:7000 (12 KiB)

# EN 修羅→"SHURA" kanji = OBJ sprites — custom graphics encoder.
# tools/encode_title_kanji_meta.py tiles export/title_kanji_en_expanded.png
# (140x72) into 16x16 sprites and emits 8 KiB OBJ tiles at $E1:5000 + a NEW
# metasprite table at $E1:A200. The metasprite pointer in SetupSpriteAndUI is
# repointed there (gated $00C8==2) so other screens keep the original 修羅.
# Nudge placement via center-x/center-y (default in the encoder). Edit PNG → rebuild.
[[rom.build.sections]]
kind = "graphics"
encoder = "tools/encode_title_kanji_meta.py:build"
file = "export/title_kanji_en_expanded.png"
offset = "$215000"          # OBJ tiles -> $E1:5000 (8 KiB)
meta-offset = "$21A200"     # metasprite table -> $E1:A200
# center-x = "183"          # uncomment to override the SHURA on-screen center
# center-y = "119"

[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/title_logo_reloc.asm"

# G3: press START on the RUSHING BEAT / JALECO splash screens -> skip to title.
# SHELVED 2026-05-30 — approach (hook WaitForVBlankStart $80DC32 to skip dwells)
# did nothing in-game; deferred for deeper investigation. patches/intro_skip.asm
# kept for reference. Re-enable by uncommenting the section below.
# [[rom.build.sections]]
# kind = "asar"
# file = "patches/intro_skip.asm"

# G2: add EN translation credit line to the RUSHING BEAT copyright splash.
[[rom.build.sections]]
kind = "asar"
cache = "1"
file = "patches/intro_credit.asm"

# VS-screen name plates — REGENERATED from char_names every build. The VS
# (2P battle) screen has its own pre-built tilemap block in bank $1F (six
# 8-char slots of [ascii, $30] words at PC $1FD9A3) which the stock ROM even
# misspells ("M-FLAME", Jaleco's own L/R slip). tools/encode_vs_names.py
# rebuilds all six plates from the active language's data/<lang>/
# char_names.txt (entries 10/2/0/8/4/6, centered like stock), so the VS
# screen always matches the HUD + char-select names — single source of truth.
[[rom.build.sections]]
kind = "python"
file = "tools/encode_vs_names.py"
offset = "$1FD9A3"

# Bordered roster name plates (the THIRD name copy) — same generator, second
# entry point. Six fixed 20-byte records at $018AD4 (`[NAME]` with A5/A6
# border tiles, chars attr $10) addressed by the per-character pointer table
# at $018AC8 (left untouched; the bank-$01 reader queues a 20-byte copy to
# tilemap $5B43/$5B53 per player). Regenerated from char_names like the VS
# block, so all three name stores stay in sync per language.
[[rom.build.sections]]
kind = "python"
file = "tools/encode_vs_names.py"
func = "build_select"
offset = "$018AD4"

# Intro narrative is now a DataDef at tables/intro.toml (fixed-records
# encoding) instead of an inline pre-encoded bin section. Retrotool reads
# data/{en,jp}/intro.txt + tables/rbshura_en.tbl and encodes at build time.
#
# Scenario 28 (engine ending — WRAM-resident L4 table). ROM source bytes
# are at $18F482 but the engine applies a ROM→WRAM transformation
# (inserts/strips FF bytes at specific positions) we haven't fully RE'd.
# Insertion stays deferred — see docs/scenario_28.toml and
# memory/project_wram_resident_scenarios.md.

[extract]
default_lang = "jp"
