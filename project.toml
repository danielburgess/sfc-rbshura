# Top-level scalars MUST come before any [section] header in TOML.
data_dirs = ["tables"]
jp_data_dir = "data/jp"
en_data_dir = "data/en"

[rom]
name = "rbshura"
# Source ROM for build. Includes:
#   1. PK Latin font patch (commit e539fbd, font glyphs in source area).
#   2. 24-bit pointer engine patch (patches/24bit_ptrs.asm) — converts
#      the L4 string-pointer dereference to read 3-byte entries so EN
#      text can be placed in any ROM bank from the freespace pool. Stub
#      lives at SNES $C8:7000..$C8:7030 (file $087000..$087030).
# Rebuild with:
#   python3 -c "from retrotool.asm import AsarPatch, apply_patch; ..."
# applying patches/24bit_ptrs.asm to rbshura_pkfont.sfc → this file.
file = "rbshura_pkfont_24bit.sfc"
mapping = "hirom"
# Expanded from 2M → 4M on 2026-05-17 so all 14 scenarios' 24-bit-ptr EN
# text fits in freespace without scavenging in-ROM gaps. HiROM addresses
# up to 4 MB via banks $C0-$FF (file 0-$3FFFFF). New banks $E0-$FF
# (file $200000-$3FFFFF) are pristine and form the bulk of the freespace
# pool.
size = "4M"

[rom.build]
# Freespace for relocate-mode 24-bit-ptr allocation. The bump allocator
# walks ranges in declaration order; the in-ROM-gap entries come first so
# small holes get filled before we eat into the expansion bank.
# The bank $08 range starts at $087080, skipping the 24-bit engine stub
# at $087000..$087030 (plus ~80 byte safety margin).
freespace = [
    ["$1A9CF3", "$1AC003"],   # bank $1A: 8977 B (largest in-ROM run)
    ["$087080", "$088000"],   # bank $08: 3968 B (after 24-bit ptr engine stub)
    ["$1AF2F3", "$1B0001"],   # bank $1A: 3343 B
    ["$0C97FE", "$0CA000"],   # bank $0C: 2050 B
    ["$023800", "$024000"],   # bank $02: 2048 B
    ["$1BF878", "$1C0006"],   # bank $1B: 1935 B
    ["$0CB9FD", "$0CC000"],   # bank $0C: 1539 B
    ["$0975DA", "$097A1B"],   # bank $09: 1089 B
    # Expansion banks $E0-$FF: 2 MB pristine pool. Used after in-ROM space
    # is exhausted. Plenty of headroom for future EN content / patches.
    ["$200000", "$400000"],   # banks $E0-$FF: 2 MB
]

[extract]
default_lang = "jp"
